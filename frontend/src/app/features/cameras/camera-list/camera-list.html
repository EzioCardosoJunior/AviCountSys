<p-card header="Câmeras">

    <p-table [value]="cameras">

        <ng-template pTemplate="header">

            <tr>

                <th>Nome</th>

                <th>Local</th>

                <th>Tipo</th>

                <th>Status</th>

            </tr>

        </ng-template>

        <ng-template pTemplate="body" let-camera>

            <tr>

                <td>{{camera.nome}}</td>

                <td>{{camera.localizacao}}</td>

                <td>{{camera.tipo}}</td>

                <td>

                    @if(camera.ativo){

                        Online

                    } @else {

                        Offline

                    }

                </td>

            </tr>

        </ng-template>

    </p-table>

</p-card>
